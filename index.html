const searchEl = document.getElementById('search');
const resultsEl = document.getElementById('results');
const cardEl = document.getElementById('card');
const emptyEl = document.getElementById('empty');
const backBtn = document.getElementById('backBtn');

function normalize(s) { return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

function renderResults(list) {
  resultsEl.innerHTML = '';
  cardEl.innerHTML = '';
  backBtn.style.display = 'none';
  if (!list.length) { emptyEl.style.display='block'; emptyEl.textContent='Sin resultados.'; return; }
  emptyEl.style.display='none';
  list.forEach(d => {
    const div = document.createElement('div');
    div.className = 'result-item';
    const color = COLORS[d.nivel_mago] || '#999';
    div.innerHTML = `<div><div class="rname">${d.nombre}</div><div class="rsub">${d.nickname} · ${d.zona}</div></div><span class="dot" style="background:${color}"></span>`;
    div.onclick = () => showCard(d);
    resultsEl.appendChild(div);
  });
}

function showList() {
  cardEl.innerHTML = '';
  backBtn.style.display = 'none';
  resultsEl.style.display = 'block';
  emptyEl.style.display = DATA.length ? 'none' : 'block';
  renderResults(currentFiltered());
}

function currentFiltered() {
  const q = normalize(searchEl.value);
  const base = q ? DATA.filter(d => normalize(d.nombre).includes(q) || normalize(d.nickname).includes(q)) : DATA.slice();
  return base.sort((a,b) => normalize(a.nombre).localeCompare(normalize(b.nombre)));
}

searchEl.addEventListener('input', () => renderResults(currentFiltered()));

function barPct(val, max) { return Math.min(100, Math.round((val/max)*100)); }

function renderHbars(obj, colorFn, labelFn) {
  const entries = Object.entries(obj || {});
  if (!entries.length) return '<div class="nodata">Sin conversaciones en los últimos 6 meses</div>';
  const max = Math.max(...entries.map(e => e[1]));
  return entries.sort((a,b)=>b[1]-a[1]).map(([k,v]) => `
    <div class="hbar-row">
      <div class="hbar-label">${labelFn ? labelFn(k) : k}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${barPct(v,max)}%; background:${colorFn ? colorFn(k) : '#009ee3'}"></div></div>
      <div class="hbar-value">${v}</div>
    </div>`).join('');
}

function renderTpvChart(series) {
  const max = Math.max(1, ...series.map(s => s.tpv));
  return `<div class="tpv-chart">` + series.map(s => {
    const h = Math.max(2, Math.round((s.tpv/max)*100));
    const [y,m] = s.mes.split('-');
    return `<div class="tpv-bar-wrap" title="${s.mes}: $${Math.round(s.tpv).toLocaleString('es-AR')}">
      <div class="tpv-bar" style="height:${h}%"></div>
      <div class="tpv-month">${m}/${y.slice(2)}</div>
    </div>`;
  }).join('') + `</div>`;
}

function renderTimeline(series) {
  const totals = series.map(s => INTENTION_KEYS.reduce((acc,k) => acc + s[k], 0));
  const max = Math.max(1, ...totals);
  const hasAny = totals.some(t => t > 0);
  if (!hasAny) return '<div class="nodata">Sin conversaciones en los últimos 6 meses</div>';
  const bars = series.map((s, i) => {
    const total = totals[i];
    const colH = Math.max(2, Math.round((total/max)*80));
    const segs = INTENTION_KEYS.filter(k => s[k] > 0).map(k => {
      const segH = total ? Math.round((s[k]/total)*100) : 0;
      return `<div class="stack-seg" style="height:${segH}%; background:${INTENTION_COLORS[k]}"></div>`;
    }).join('');
    const [y,m] = s.mes.split('-');
    return `<div class="stack-wrap" title="${s.mes}: ${total} convs">
      <div class="stack-col" style="height:${colH}px">${segs}</div>
      <div class="stack-month">${m}/${y.slice(2)}</div>
    </div>`;
  }).join('');
  const legend = INTENTION_KEYS.filter(k => series.some(s => s[k] > 0))
    .map(k => `<span><span class="sw" style="background:${INTENTION_COLORS[k]}"></span>${INTENTION_LABELS[k]}</span>`).join('');
  return `<div class="stack-chart">${bars}</div><div class="legend">${legend}</div>`;
}

      <div class="field-row"><span class="k">Última conversación BP</span><span class="v">${d.fecha_ult_conv || '—'}</span></div>
      <div class="bars">
        <div class="bar-item">
          <div class="bar-track"><div class="bar-fill" style="height:${barPct(d.convs_bp_6m,20)}%; background:#009ee3;"></div></div>
          <div class="bar-value">${d.convs_bp_6m}</div>
          <div class="bar-label">Convs BP (6m)</div>
        </div>
        <div class="bar-item">
          <div class="bar-track"><div class="bar-fill" style="height:${barPct(d.dias_activos_30d,30)}%; background:#7cb342;"></div></div>
          <div class="bar-value">${d.dias_activos_30d}</div>

          <div class="bar-label">Semanas activas (4s)</div>
        </div>
      </div>
    </div>

    <div class="field-group">
